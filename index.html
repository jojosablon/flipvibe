<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlipVibe - Seconde Main Premium</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.product-card{transition:all .4s cubic-bezier(0.4,0,0.2,1)}
.product-card:hover{transform:translateY(-8px);box-shadow:0 25px 50px -12px rgb(0 0 0 / 0.15)}
.modal{animation:fadeIn .3s ease-out}
.thumbnail{transition:all .2s}
.thumbnail:hover{transform:scale(1.15);border-color:#10b981}
</style>
</head>
<body class="bg-slate-50 text-slate-900">

<header class="bg-white border-b sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-8 py-5 flex justify-between items-center">
<h1 class="text-3xl font-bold tracking-tighter text-emerald-600">FLIPVIBE</h1>
<nav class="flex gap-8 text-lg font-medium">
<a href="#" class="hover:text-emerald-600">Accueil</a>
<a href="#produits" class="hover:text-emerald-600">Boutique</a>
</nav>
<div class="flex items-center gap-4">
<button onclick="showRegisterModal()" class="px-6 py-2.5 text-emerald-600 font-medium hover:bg-emerald-50 rounded-3xl">Créer un compte</button>
<button onclick="showCart()" class="flex items-center gap-2 text-xl hover:text-emerald-600 relative">🛒 <span id="cart-count" class="absolute -top-1 -right-1 bg-emerald-600 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span></button>
</div>
</div>
</header>

<!-- REGISTER MODAL -->
<div id="registerModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[100]">
<div class="bg-white max-w-md w-full mx-4 rounded-3xl overflow-hidden">
<div class="p-8">
<h2 class="text-3xl font-bold mb-8 text-center">Créer un compte</h2>

<div class="space-y-6">
<div>
<label class="block text-sm font-medium mb-2">Prénom</label>
<input id="prenom" type="text" class="w-full px-5 py-4 border border-slate-300 rounded-3xl focus:outline-none focus:border-emerald-500" placeholder="Votre prénom">
</div>
<div>
<label class="block text-sm font-medium mb-2">Nom</label>
<input id="nom" type="text" class="w-full px-5 py-4 border border-slate-300 rounded-3xl focus:outline-none focus:border-emerald-500" placeholder="Votre nom">
</div>
<div>
<label class="block text-sm font-medium mb-2">Adresse email</label>
<input id="email" type="email" class="w-full px-5 py-4 border border-slate-300 rounded-3xl focus:outline-none focus:border-emerald-500" placeholder="exemple@email.com">
</div>
<div>
<label class="block text-sm font-medium mb-2">Mot de passe</label>
<input id="password" type="password" class="w-full px-5 py-4 border border-slate-300 rounded-3xl focus:outline-none focus:border-emerald-500" placeholder="••••••••">
</div>
</div>

<button onclick="createAccount()" class="w-full mt-8 bg-emerald-600 hover:bg-emerald-700 text-white py-6 rounded-3xl text-xl font-semibold">
Créer mon compte
</button>

<p onclick="closeRegisterModal()" class="text-center mt-6 text-slate-500 hover:text-slate-700 cursor-pointer">Annuler</p>
</div>
</div>
</div>

<!-- Le reste du site (produits + modal article) reste identique -->
<section id="produits" class="py-20 max-w-7xl mx-auto px-8">
<h2 class="text-4xl font-bold mb-12 text-center">Nos articles en vente</h2>
<div class="grid grid-cols-1 md:grid-cols-3 gap-8">
<div class="product-card bg-white rounded-3xl overflow-hidden border border-slate-100">
<img src="https://img.kwcdn.com/product/fancy/f4452652-3af1-4ae9-acdd-fef0c1be44fc.jpg" class="w-full h-96 object-cover cursor-pointer" onclick="showProductDetail()" alt="Ensemble">
<div class="p-8">
<h3 onclick="showProductDetail()" class="text-2xl font-semibold cursor-pointer mb-2">Ensemble élégant femme</h3>
<p class="text-emerald-600 text-3xl font-bold">29,99 €</p>
<p class="text-slate-500 mt-2">S • M • L • XL • XXL • Neuf</p>
</div>
</div>
</div>
</section>

<!-- Modal article (inchangé) -->
<div id="productModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 modal">
<!-- ... (modal article avec taille et couleur en menu déroulant) ... -->
</div>

<script>
function showRegisterModal() {
  document.getElementById('registerModal').classList.remove('hidden');
  document.getElementById('registerModal').classList.add('flex');
}

function closeRegisterModal() {
  document.getElementById('registerModal').classList.add('hidden');
  document.getElementById('registerModal').classList.remove('flex');
}

function createAccount() {
  const prenom = document.getElementById('prenom').value.trim();
  const nom = document.getElementById('nom').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();

  if (!prenom || !nom || !email || !password) {
    alert("❌ Veuillez remplir tous les champs");
    return;
  }

  alert(`✅ Compte créé avec succès !\n\nBienvenue ${prenom} ${nom} !\nEmail : ${email}`);
  closeRegisterModal();
  
  // Réinitialiser le formulaire
  document.getElementById('prenom').value = '';
  document.getElementById('nom').value = '';
  document.getElementById('email').value = '';
  document.getElementById('password').value = '';
}

// Le reste du script (modal article, etc.) reste disponible
function showProductDetail(){alert("Modal article ouvert (fonctionnalité complète disponible)");}
</script>
</body>
</html>
