<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlipVibe - Seconde Main Premium</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.product-card{transition:all .4s cubic-bezier(0.4,0,0.2,1)}
.product-card:hover{transform:translateY(-8px);box-shadow:0 25px 50px -12px rgb(0 0 0 / 0.15)}
.modal{animation:fadeIn .3s ease-out}
.thumbnail{transition:all .2s}
.thumbnail:hover{transform:scale(1.15);border-color:#10b981}
</style>
</head>
<body class="bg-slate-50 text-slate-900">

<header class="bg-white border-b sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-8 py-5 flex justify-between items-center">
<h1 class="text-3xl font-bold tracking-tighter text-emerald-600">FLIPVIBE</h1>
<nav class="flex gap-8 text-lg font-medium">
<a href="#" class="hover:text-emerald-600">Accueil</a>
<a href="#produits" class="hover:text-emerald-600">Boutique</a>
</nav>

<div id="headerButtons" class="flex items-center gap-4">
  <!-- Buttons will be updated by JavaScript -->
</div>
</div>
</header>

<!-- PRODUCT CARD -->
<section id="produits" class="py-20 max-w-7xl mx-auto px-8">
<h2 class="text-4xl font-bold mb-12 text-center">Nos articles en vente</h2>
<div class="grid grid-cols-1 md:grid-cols-3 gap-8">
<div class="product-card bg-white rounded-3xl overflow-hidden border border-slate-100">
<img src="https://img.kwcdn.com/product/fancy/f4452652-3af1-4ae9-acdd-fef0c1be44fc.jpg" class="w-full h-96 object-cover cursor-pointer" onclick="showProductDetail()" alt="Ensemble">
<div class="p-8">
<h3 onclick="showProductDetail()" class="text-2xl font-semibold cursor-pointer mb-2">Ensemble élégant femme</h3>
<p class="text-emerald-600 text-3xl font-bold">29,99 €</p>
<p class="text-slate-500 mt-2">S • M • L • XL • XXL • Neuf</p>
</div>
</div>
</div>
</section>

<!-- PRODUCT MODAL -->
<div id="productModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 modal">
<div class="bg-white max-w-6xl w-full mx-4 rounded-3xl overflow-hidden max-h-[95vh] flex flex-col">
<div class="p-8 flex-1 overflow-auto">
<div class="flex justify-between items-start mb-6">
<h2 class="text-4xl font-bold">Ensemble élégant femme</h2>
<button onclick="closeProductModal()" class="text-5xl text-slate-300 hover:text-slate-500">×</button>
</div>

<div class="flex gap-8">
<div class="flex-1">
<img id="mainImage" src="https://img.kwcdn.com/product/fancy/f4452652-3af1-4ae9-acdd-fef0c1be44fc.jpg" class="w-full max-h-[480px] object-contain rounded-3xl shadow-md mx-auto" alt="Ensemble">
</div>
<div class="flex flex-col gap-1 w-12">
<img onclick="changeImage(this)" src="https://raw.githubusercontent.com/jojosablon/flipvibe/main/tenue-kaki-1.png" class="thumbnail w-12 h-12 object-cover rounded-xl cursor-pointer border-2 border-transparent">
<img onclick="changeImage(this)" src="https://raw.githubusercontent.com/jojosablon/flipvibe/main/tenue-kaki-2.png" class="thumbnail w-12 h-12 object-cover rounded-xl cursor-pointer border-2 border-transparent">
<img onclick="changeImage(this)" src="https://raw.githubusercontent.com/jojosablon/flipvibe/main/tenue-kaki-3.png" class="thumbnail w-12 h-12 object-cover rounded-xl cursor-pointer border-2 border-transparent">
<img onclick="changeImage(this)" src="https://raw.githubusercontent.com/jojosablon/flipvibe/main/tenue-vert-olive-1.png" class="thumbnail w-12 h-12 object-cover rounded-xl cursor-pointer border-2 border-transparent">
<img onclick="changeImage(this)" src="https://raw.githubusercontent.com/jojosablon/flipvibe/main/tenue-vert-olive-2.png" class="thumbnail w-12 h-12 object-cover rounded-xl cursor-pointer border-2 border-transparent">
<img onclick="changeImage(this)" src="https://raw.githubusercontent.com/jojosablon/flipvibe/main/tenue-vert-olive-3.png" class="thumbnail w-12 h-12 object-cover rounded-xl cursor-pointer border-2 border-transparent">
</div>
</div>

<div class="mt-10 grid grid-cols-2 gap-8">
<div>
<label class="block text-sm font-medium text-slate-600 mb-2">Taille</label>
<select id="sizeSelect" class="w-full px-5 py-4 border border-slate-300 rounded-3xl text-lg focus:outline-none focus:border-emerald-500">
<option value="">Choisir une taille</option>
<option value="S">S</option>
<option value="M">M</option>
<option value="L">L</option>
<option value="XL">XL</option>
<option value="XXL">XXL</option>
</select>
</div>
<div>
<label class="block text-sm font-medium text-slate-600 mb-2">Couleur</label>
<select id="colorSelect" class="w-full px-5 py-4 border border-slate-300 rounded-3xl text-lg focus:outline-none focus:border-emerald-500">
<option value="">Choisir une couleur</option>
<option value="Kaki">🟫 Kaki</option>
<option value="Vert Olive">🟩 Vert Olive</option>
</select>
</div>
</div>
</div>

<div class="p-8 border-t">
<button onclick="addToCartFromModal()" class="w-full bg-emerald-600 text-white py-7 rounded-3xl text-2xl font-semibold hover:bg-emerald-700">
Ajouter au panier
</button>
</div>
</div>
</div>

<!-- LOGIN / REGISTER / ACCOUNT MODALS -->
<div id="authModal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[100]">
<div class="bg-white max-w-md w-full mx-4 rounded-3xl overflow-hidden" id="authContent">
<!-- Dynamic content loaded by JS -->
</div>
</div>

<script>
let currentUser = null;

// Update header based on login status
function updateHeader() {
  const headerButtons = document.getElementById('headerButtons');
  if (currentUser) {
    headerButtons.innerHTML = `
      <button onclick="showAccountModal()" class="px-6 py-2.5 font-medium text-emerald-600 hover:bg-emerald-50 rounded-3xl flex items-center gap-2">
        👤 Mon compte
      </button>
    `;
  } else {
    headerButtons.innerHTML = `
      <button onclick="showLoginModal()" class="px-6 py-2.5 font-medium text-emerald-600 hover:bg-emerald-50 rounded-3xl">Se connecter</button>
      <button onclick="showRegisterModal()" class="px-6 py-2.5 bg-emerald-600 text-white font-medium rounded-3xl hover:bg-emerald-700">Créer un compte</button>
    `;
  }
}

// Show account modal (when logged in)
function showAccountModal() {
  const html = `
    <div class="p-8">
      <h2 class="text-3xl font-bold mb-8 text-center">Mon compte</h2>
      <div class="space-y-6">
        <div>
          <label class="block text-sm font-medium mb-2">Prénom</label>
          <input id="editPrenom" value="${currentUser.prenom || ''}" type="text" class="w-full px-5 py-4 border border-slate-300 rounded-3xl focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">Nom</label>
          <input id="editNom" value="${currentUser.nom || ''}" type="text" class="w-full px-5 py-4 border border-slate-300 rounded-3xl focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-sm font-medium mb-2">Email</label>
          <input id="editEmail" value="${currentUser.email}" type="email" class="w-full px-5 py-4 border border-slate-300 rounded-3xl focus:outline-none focus:border-emerald-500">
        </div>
      </div>
      <button onclick="saveAccountChanges()" class="w-full mt-8 bg-emerald-600 hover:bg-emerald-700 text-white py-6 rounded-3xl text-xl font-semibold">Enregistrer les modifications</button>
      <button onclick="logout()" class="w-full mt-4 text-red-500 py-4">Se déconnecter</button>
      <p onclick="closeAuthModal()" class="text-center mt-6 text-slate-500 hover:text-slate-700 cursor-pointer">Fermer</p>
    </div>`;
  document.getElementById('authContent').innerHTML = html;
  document.getElementById('authModal').classList.remove('hidden');
  document.getElementById('authModal').classList.add('flex');
}

// Save changes
function saveAccountChanges() {
  currentUser.prenom = document.getElementById('editPrenom').value;
  currentUser.nom = document.getElementById('editNom').value;
  currentUser.email = document.getElementById('editEmail').value;
  localStorage.setItem('flipvibe_user', JSON.stringify(currentUser));
  alert("✅ Modifications enregistrées !");
  closeAuthModal();
}

function logout() {
  currentUser = null;
  localStorage.removeItem('flipvibe_user');
  closeAuthModal();
  updateHeader();
  alert("Vous avez été déconnecté.");
}

// Login & Register (simplified)
function showLoginModal() {
  const html = `
    <div class="p-8">
      <h2 class="text-3xl font-bold mb-8 text-center">Se connecter</h2>
      <div class="space-y-6">
        <div><label class="block text-sm font-medium mb-2">Email</label><input id="loginEmail" type="email" class="w-full px-5 py-4 border border-slate-300 rounded-3xl focus:outline-none focus:border-emerald-500"></div>
        <div><label class="block text-sm font-medium mb-2">Mot de passe</label><input id="loginPassword" type="password" class="w-full px-5 py-4 border border-slate-300 rounded-3xl focus:outline-none focus:border-emerald-500"></div>
      </div>
      <button onclick="login()" class="w-full mt-8 bg-emerald-600 hover:bg-emerald-700 text-white py-6 rounded-3xl text-xl font-semibold">Se connecter</button>
      <p onclick="closeAuthModal()" class="text-center mt-6 text-slate-500 hover:text-slate-700 cursor-pointer">Annuler</p>
    </div>`;
  document.getElementById('authContent').innerHTML = html;
  document.getElementById('authModal').classList.remove('hidden');
  document.getElementById('authModal').classList.add('flex');
}

function showRegisterModal() {
  const html = `
    <div class="p-8">
      <h2 class="text-3xl font-bold mb-8 text-center">Créer un compte</h2>
      <div class="space-y-6">
        <div><label class="block text-sm font-medium mb-2">Prénom</label><input id="prenom" type="text" class="w-full px-5 py-4 border border-slate-300 rounded-3xl focus:outline-none focus:border-emerald-500"></div>
        <div><label class="block text-sm font-medium mb-2">Nom</label><input id="nom" type="text" class="w-full px-5 py-4 border border-slate-300 rounded-3xl focus:outline-none focus:border-emerald-500"></div>
        <div><label class="block text-sm font-medium mb-2">Email</label><input id="email" type="email" class="w-full px-5 py-4 border border-slate-300 rounded-3xl focus:outline-none focus:border-emerald-500"></div>
        <div><label class="block text-sm font-medium mb-2">Mot de passe</label><input id="password" type="password" class="w-full px-5 py-4 border border-slate-300 rounded-3xl focus:outline-none focus:border-emerald-500"></div>
      </div>
      <button onclick="createAccount()" class="w-full mt-8 bg-emerald-600 hover:bg-emerald-700 text-white py-6 rounded-3xl text-xl font-semibold">Créer mon compte</button>
      <p onclick="closeAuthModal()" class="text-center mt-6 text-slate-500 hover:text-slate-700 cursor-pointer">Annuler</p>
    </div>`;
  document.getElementById('authContent').innerHTML = html;
  document.getElementById('authModal').classList.remove('hidden');
  document.getElementById('authModal').classList.add('flex');
}

function closeAuthModal() {
  document.getElementById('authModal').classList.add('hidden');
  document.getElementById('authModal').classList.remove('flex');
}

function createAccount() {
  const prenom = document.getElementById('prenom').value.trim();
  const nom = document.getElementById('nom').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  if (!prenom || !nom || !email || !password) {
    alert("Veuillez remplir tous les champs");
    return;
  }
  currentUser = {prenom, nom, email, password};
  localStorage.setItem('flipvibe_user', JSON.stringify(currentUser));
  alert("Compte créé avec succès !");
  closeAuthModal();
  updateHeader();
}

function login() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const savedUser = JSON.parse(localStorage.getItem('flipvibe_user'));
  if (savedUser && savedUser.email === email && savedUser.password === password) {
    currentUser = savedUser;
    alert("✅ Connexion réussie !");
    closeAuthModal();
    updateHeader();
  } else {
    alert("❌ Email ou mot de passe incorrect");
  }
}

function updateHeader() {
  // Already handled in the header
  // This function is called after login/register
  location.reload(); // Simple way to refresh header
}

// Product modal functions
function showProductDetail() {
  document.getElementById('sizeSelect').value = "";
  document.getElementById('colorSelect').value = "";
  document.getElementById('productModal').classList.remove('hidden');
  document.getElementById('productModal').classList.add('flex');
}
function closeProductModal() {
  document.getElementById('productModal').classList.add('hidden');
  document.getElementById('productModal').classList.remove('flex');
}
function changeImage(thumb) {
  document.getElementById('mainImage').src = thumb.src;
}
function addToCartFromModal() {
  const size = document.getElementById('sizeSelect').value;
  const color = document.getElementById('colorSelect').value;
  if (!size || !color) {
    alert("❌ Veuillez choisir une taille et une couleur");
    return;
  }
  alert(`✅ Ajouté au panier !\nTaille: ${size} | Couleur: ${color}`);
  closeProductModal();
}

document.getElementById('productModal').addEventListener('click', function(e) {
  if (e.target === this) closeProductModal();
});

// Init
updateHeader();
</script>
</body>
</html>
